<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Message</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(180deg, #faf7f3, #ffffff);
      overflow: hidden;
      color: #333;
    }

    /* ===== バブル演出 ===== */
    .bubble {
      position: fixed;
      bottom: -10%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.25));
      opacity: 0.7;
      animation: floatUp linear infinite;
      z-index: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8);
      }
      100% {
        transform: translateY(-120vh) scale(1.2);
      }
    }

    /* ===== レイアウト ===== */
    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 30px;
    }

    .thankyou-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      margin-bottom: 12px;
    }

    input, textarea {
      width: 90%;
      max-width: 500px;
      padding: 14px;
      margin: 10px 0;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 16px;
      font-family: inherit;
    }

    button {
      margin-top: 20px;
      padding: 14px 36px;
      font-size: 16px;
      border: none;
      border-radius: 999px;
      background: #222;
      color: #fff;
      cursor: pointer;
    }

    button.secondary {
      background: none;
      color: #555;
      text-decoration: underline;
      margin-top: 16px;
    }

    .character {
      width: 160px;
      margin: 20px 0;
      animation: bounce 1.8s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .hidden { display: none; }

    /* Thank you フェードイン */
    .fade-in {
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* メッセージ一覧 */
    .log {
      font-size: 14px;
      text-align: left;
      max-width: 600px;
      margin: 10px auto;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
  </style>
</head>
<body>

<!-- ===== バブル生成 ===== -->
<script>
  for (let i = 0; i < 18; i++) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.style.left = Math.random() * 100 + 'vw';
    bubble.style.animationDuration = 10 + Math.random() * 6 + 's';
    bubble.style.animationDelay = Math.random() * 5 + 's';
    document.body.appendChild(bubble);
  }
</script>

<!-- ===== 入力画面 ===== -->
<div class="container" id="formScreen">
  <h1>YOSHITOMO ＆ MISATO</h1>
  <div class="subtitle">よかったら、ひとことお祝いメッセージをお願いします！</div>

  <input id="nameInput" type="text" placeholder="お名前" />
  <textarea id="messageInput" rows="4" placeholder="メッセージ"></textarea>

  <button onclick="submitMessage()">送信</button>
</div>

<!-- ===== Thank you 画面 ===== -->
<div class="container hidden fade-in" id="thankYouScreen">
  <div class="thankyou-title">Thank you for celebrating our wedding</div>
  <img id="characterImage" class="character" src="" alt="character" />
  <h2 id="thankYouText"></h2>
  <button class="secondary" onclick="resetScreen()">はじめに戻る</button>
  <button class="secondary" onclick="showLog()">メッセージ一覧を見る</button>
</div>

<!-- ===== メッセージ一覧 ===== -->
<div class="container hidden" id="logScreen">
  <h2 class="thankyou-title">Messages</h2>
  <div id="logList"></div>
  <button class="secondary" onclick="backToTop()">戻る</button>
</div>

<script>
  const characters = [
    {
      img: 'dog.png',
      lines: ['ありがとう！', '来てくれてうれしいワン！', '最高の日を一緒に楽しもう！']
    },
    {
      img: 'cat.png',
      lines: ['ありがとうにゃ！', '来てくれて感謝です', 'ゆっくり楽しんでね']
    }
  ];

  function submitMessage() {
    const name = nameInput.value.trim();
    if (!name) return alert('お名前を入力してください');

    const chara = characters[Math.floor(Math.random() * characters.length)];
    const line = chara.lines[Math.floor(Math.random() * chara.lines.length)];

    characterImage.src = chara.img;
    thankYouText.innerText = `${name}さん、${line}`;

    const logs = JSON.parse(localStorage.getItem('messages') || '[]');
    logs.push({ name, message: messageInput.value, date: new Date().toLocaleString() });
    localStorage.setItem('messages', JSON.stringify(logs));

    formScreen.classList.add('hidden');
    thankYouScreen.classList.remove('hidden');
  }

  function resetScreen() {
    nameInput.value = '';
    messageInput.value = '';
    thankYouScreen.classList.add('hidden');
    formScreen.classList.remove('hidden');
  }

  function showLog() {
    logList.innerHTML = '';
    const logs = JSON.parse(localStorage.getItem('messages') || '[]');
    logs.forEach(l => {
      const div = document.createElement('div');
      div.className = 'log';
      div.innerText = `${l.date} / ${l.name}さん：${l.message}`;
      logList.appendChild(div);
    });
    thankYouScreen.classList.add('hidden');
    logScreen.classList.remove('hidden');
  }

  function backToTop() {
    logScreen.classList.add('hidden');
    formScreen.classList.remove('hidden');
  }
</script>

</body>
</html>
